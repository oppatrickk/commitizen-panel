name: Release

# Publishing is deliberately gated on pushing a version tag, so no commit to main
# can ship to the Marketplace on its own.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and attach the VSIX without publishing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # Kept as a regression guard: an unset publisher would otherwise only surface
      # as an authentication failure partway through publishing.
      - name: Refuse to publish with a placeholder publisher
        run: |
          publisher="$(node -p "require('./package.json').publisher")"
          case "$publisher" in
            ''|your-publisher-id|TODO*)
              echo "package.json has a placeholder publisher ($publisher). Set a Marketplace publisher you own first." >&2
              exit 1
              ;;
          esac

      # vsce rewrites relative image paths in the README to raw.githubusercontent
      # URLs, so a missing file does not fail the build — it just renders as a
      # broken image on the Marketplace page, where it is most visible.
      - name: Check README images exist
        run: |
          missing=0
          while IFS= read -r img; do
            case "$img" in
              http*) continue ;;
            esac
            if [ ! -f "$img" ]; then
              echo "README references a missing image: $img" >&2
              missing=1
            fi
          done < <(grep -o '!\[[^]]*\]([^)]*)' README.md | sed 's/.*(\(.*\))/\1/')
          exit $missing

      - name: Package
        run: npx vsce package --out conventional-commit-panel.vsix

      - name: Attach the VSIX to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: conventional-commit-panel.vsix
          generate_release_notes: true

      # Publishing is skipped rather than failed in the two cases where it cannot
      # succeed: no token configured, and a version already on the Marketplace
      # (which rejects a duplicate). Tagging a version that was uploaded by hand
      # should still produce a clean GitHub release. Both cases are logged — a
      # silent skip would look identical to a successful publish.
      - name: Decide whether to publish
        id: gate
        env:
          HAS_PAT: ${{ secrets.VSCE_PAT != '' }}
        run: |
          id="$(node -p "const p = require('./package.json'); p.publisher + '.' + p.name")"
          version="$(node -p "require('./package.json').version")"
          live="$(npx vsce show "$id" --json 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).versions[0].version)}catch{}})" \
            || true)"

          if [ "$HAS_PAT" != "true" ]; then
            echo "::notice::No VSCE_PAT secret is set — building the release without publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$live" = "$version" ]; then
            echo "::notice::Version $version is already on the Marketplace — skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true && steps.gate.outputs.publish == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath conventional-commit-panel.vsix
